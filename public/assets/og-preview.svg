<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#0E1B33"/>
      <stop offset="60%" stop-color="#080A10"/>
      <stop offset="100%" stop-color="#05070B"/>
    </radialGradient>
    <radialGradient id="blueOrb" cx="30%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#DCE9FE"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="cardShadow" x="650" y="80" width="480" height="470" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <circle cx="350" cy="250" r="380" fill="url(#blueOrb)"/>

  <!-- Left Copy Area -->
  <g transform="translate(100, 130)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="310" height="38" rx="19" fill="#0E1528" stroke="#3882FF" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="20" cy="19" r="5" fill="#3882FF"/>
    <text x="35" y="24" fill="#93C5FD" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="1">WHISPERLEDGER AI 2.0</text>

    <!-- Headline -->
    <text x="0" y="105" fill="url(#textGrad)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      Your Money,
    </text>
    <text x="0" y="165" fill="#3882FF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      Commanded by Voice.
    </text>
    <text x="0" y="225" fill="url(#goldGrad)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Protected by Legal AI.
    </text>

    <!-- Subtitle -->
    <text x="0" y="280" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="500">
      Zero-battery SMS parsing • 99.8% accurate voice audio ledger
    </text>
    <text x="0" y="310" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="500">
      Automated legal dispute notices for stuck refunds &amp; UPI debits.
    </text>

    <!-- Social Proof Badges -->
    <g transform="translate(0, 350)">
      <rect x="0" y="0" width="180" height="42" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="26" fill="#F8FAFC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700">★ 4.9 App Rating</text>
      
      <rect x="195" y="0" width="220" height="42" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="210" y="26" fill="#10B981" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700">₹1.8 Cr+ Recovered</text>
    </g>
  </g>

  <!-- Right Graphic: 3D Luxury Glass Mockup Card -->
  <g filter="url(#cardShadow)">
    <rect x="700" y="110" width="400" height="410" rx="28" fill="#0E111F" fill-opacity="0.88" stroke="#3882FF" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <!-- Dynamic Header inside card -->
    <rect x="725" y="135" width="40" height="40" rx="12" fill="#0066FF" fill-opacity="0.2"/>
    <text x="738" y="160" fill="#3882FF" font-size="18">🎙️</text>
    <text x="775" y="152" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700">Live Voice Transcription</text>
    <text x="775" y="168" fill="#10B981" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600">● 0.38s Neural Speech Parsing</text>

    <!-- Speech Waveform -->
    <g transform="translate(730, 200)">
      <rect x="0" y="12" width="6" height="24" rx="3" fill="#3882FF"/>
      <rect x="12" y="4" width="6" height="40" rx="3" fill="#60A5FA"/>
      <rect x="24" y="16" width="6" height="16" rx="3" fill="#3882FF"/>
      <rect x="36" y="0" width="6" height="48" rx="3" fill="#93C5FD"/>
      <rect x="48" y="10" width="6" height="28" rx="3" fill="#60A5FA"/>
      <rect x="60" y="20" width="6" height="12" rx="3" fill="#3882FF"/>
      <text x="80" y="30" fill="#F8FAFC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600">“Starbucks coffee ₹350 on card”</text>
    </g>

    <!-- Auto-Extracted Row -->
    <rect x="725" y="270" width="350" height="65" rx="16" fill="#13182E" stroke="#1E293B" stroke-width="1"/>
    <rect x="740" y="282" width="40" height="40" rx="10" fill="#0066FF" fill-opacity="0.2"/>
    <text x="752" y="307" font-size="16">☕</text>
    <text x="792" y="298" fill="#F8FAFC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700">Starbucks Coffee</text>
    <text x="792" y="316" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">Food &amp; Dining • HDFC Card</text>
    <text x="1010" y="305" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800">₹350</text>

    <!-- Legal Recovery Badge Row -->
    <rect x="725" y="350" width="350" height="65" rx="16" fill="#1A181E" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="740" y="362" width="40" height="40" rx="10" fill="#F59E0B" fill-opacity="0.2"/>
    <text x="752" y="387" font-size="16">🛡️</text>
    <text x="792" y="378" fill="#F8FAFC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700">L2 Legal Notice Ready</text>
    <text x="792" y="396" fill="#F59E0B" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">Swiggy Failed Refund Dispute (₹840)</text>
    <text x="990" y="386" fill="#10B981" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700">+ WhatsApp</text>
    
    <!-- Bottom Brand Watermark -->
    <text x="725" y="445" fill="#64748B" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">whisperledger.app • iOS &amp; Android</text>
  </g>
</svg>
